[project]
name = "partygame"
version = "0.1.0"
description = "Backend for a syllable-by-syllable party guessing game"
authors = [
    { name = "skladkansaeng", email = "settakarn.kl@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "pronouncing>=0.3.0",
    "pythainlp>=5.3.8",
    "python-crfsuite>=0.9.12",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
